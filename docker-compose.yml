name: snapfix

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: snapfix
      POSTGRES_PASSWORD: snapfix
      POSTGRES_DB: snapfix
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snapfix -d snapfix"]
      interval: 3s
      timeout: 3s
      retries: 30

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://snapfix:snapfix@db:5432/snapfix
      UPLOAD_DIR: /data/uploads
      EVAL_RESULTS_DIR: /eval/results
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
    ports:
      - "8000:8000"
    volumes:
      - uploads:/data/uploads
      - ./eval:/eval
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 10s

  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 10s

volumes:
  pgdata:
  uploads:
