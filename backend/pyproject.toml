[project]
name = "snapfix-backend"
version = "0.1.0"
description = "SnapFix: GenAI work-order copilot for facilities maintenance (backend)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "anthropic>=0.60",
    "sentence-transformers>=3.0",
    "torch>=2.3",
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "pillow>=10.3",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "apscheduler>=3.10,<4",
]

[project.optional-dependencies]
stt = ["faster-whisper>=1.0"]
vision = ["opencv-python-headless>=4.9"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
